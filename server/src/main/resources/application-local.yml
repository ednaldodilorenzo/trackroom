spring:
  application:
    name: trackroom
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 500
        prepStmtCacheSqlLimit: 2048
  jpa:
    show-sql: true
    defer-datasource-initialization: true
  devtools:
    restart:
      enabled: true
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    default-schema: public
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  threads:
    virtual:
      enabled: true
  mvc:
    converters:
      preferred-json-mapper: jackson
  jackson:
    parser:
      allow-non-numeric-numbers: true
  main:
    lazy-initialization: true

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.boot.autoconfigure.liquibase: DEBUG
    org.liquibase: DEBUG

server:
  servlet:
    context-path: /api
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  http2:
    enabled: true
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types: application/json

management:
  endpoints:
    web:
      exposure:
        exclude: "*"
  endpoint:
    health:
      show-details: always

jwt:
  key: 'a9c986ede938a8b4f8721737c62efd8568ba43e976e2b77cdd90d0b2c4f66e97'
  accessTokenExpiration: 3600

filestorage:
  accesskey: minioadmin
  secretkey: minioadmin
  endpoint: http://minio:9000
  region: us-east-1

queue:
  ids:
    email-account-confirmation-id: QUEUE_MESSAGE_ACCOUNT_CONFIRM
    email-password-reset-id: QUEUE_EMAIL_PASSWORD_RESET
