spring:
  application:
    name: trackroom
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
  devtools:
    restart:
      enabled: true
  liquibase:
    enabled: true
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  threads:
    virtual:
      enabled: true

logging:
  level:
    org.springframework.security: DEBUG

server:
  servlet:
    context-path: /api
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  http2:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

jwt:
  key: 'a9c986ede938a8b4f8721737c62efd8568ba43e976e2b77cdd90d0b2c4f66e97'
  accessTokenExpiration: 3600

filestorage:
  accesskey: minioadmin
  secretkey: minioadmin
  endpoint: http://minio:9000
  region: us-east-1

queue:
  ids:
    email-account-confirmation-id: QUEUE_MESSAGE_ACCOUNT_CONFIRM
    email-password-reset-id: QUEUE_EMAIL_PASSWORD_RESET
