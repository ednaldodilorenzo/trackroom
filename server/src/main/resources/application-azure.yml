spring:
  application:
    name: trackroom
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 500
        prepStmtCacheSqlLimit: 2048
  liquibase:
    enabled: true
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  threads:
    virtual:
      enabled: true
  mvc:
    converters:
      preferred-json-mapper: jackson
  jackson:
    parser:
      allow-non-numeric-numbers: true
  main:
    lazy-initialization: true

logging:
  level:
    root: WARN
    # Only log security errors (failed auths, access denied)
    org.springframework.security: WARN
    # Only log unhandled exceptions and 5xx errors
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR
    org.springframework.boot.web.servlet.error.DefaultErrorAttributes: ERROR
    # Your app at INFO so you still see business-level logs
    com.poc.crud: INFO

server:
  servlet:
    context-path: /api
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  http2:
    enabled: true
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types: application/json

management:
  endpoints:
    web:
      exposure:
        exclude: "*"
  endpoint:
    health:
      show-details: always

jwt:
  key: a9c986ede938a8b4f8721737c62efd8568ba43e976e2b77cdd90d0b2c4f66e97
  accessTokenExpiration: 3600

queue:
  ids:
    email-account-confirmation-id: email-confirmation
    email-password-reset-id: password-reset


