services:
  app:
    build:
      dockerfile: Dockerfile-dev
    ports:
      - "8080:8080"
      - "5005:5005"
    volumes:
      - ./server/src/main:/app/src/main
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      dockerfile: Dockerfile-dev
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  db:
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bioaccess"]
      interval: 10s
      timeout: 5s
      retries: 10    

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${FS_USERNAME}
      MINIO_ROOT_PASSWORD: ${FS_PASSWORD}
      S3_ENDPOINT: http://localhost:9000
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: always
  
volumes:
  minio_data:
