services:
  redis:
    image: redis:latest
    restart: always
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  db:
    image: 'postgres:latest'
    environment:
      POSTGRES_DB: trackroom
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bioaccess"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    build:
      context: ./server
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_REDIS_HOST: ${CACHE_HOST}
      SPRING_DATA_REDIS_PORT: ${CACHE_PORT}
      SPRING_DATA_REDIS_SSL_ENABLED: ${CACHE_SSL_ENABLED}
      SPRING_DATA_REDIS_PASSWORD: ${CACHE_PASSWORD}
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_LIQUIBASE_ENABLED: true
      OCI_CONFIG_PATH: /.oci/config
      APP_FRONT_URL: ${APP_FRONT_URL}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
    volumes:
      - /home/ubuntu/.oci:/.oci:ro

  #web:
  #  build:
  #    context: ./web
  #  ports:
  #    - "443:443" # Usado apenas em produção, pois em testes automatizados utilizado na rede interna.
  #  depends_on:
  #    - app  

volumes:
  redis_data:
  postgres_data:

