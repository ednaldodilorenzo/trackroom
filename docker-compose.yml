services:
  redis:
    image: redis:latest
    restart: always
    volumes:
      - redis_data:/data
    expose:
      - "6379"
      
  db:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bioaccess"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./server
      target: development
    expose:
      - "8080"    
    environment:
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_LIQUIBASE_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: local
#      JAVA_OPTS: >
#        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
#        -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
#        -Djava.security.egd=file:/dev/./urandom
    volumes:
      - ./server/src/main:/app/src/main
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      target: ${BUILD_TARGET:-development}
    ports:
      - "80:80" # Usado apenas em produção, pois em testes automatizados utilizado na rede interna.
    depends_on:
      - app  

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${FS_USERNAME}
      MINIO_ROOT_PASSWORD: ${FS_PASSWORD}
      S3_ENDPOINT: http://localhost:9000
    volumes:
      - minio_data:/data
    expose:    
      - "9001"
      - "9000"
    restart: always

volumes:
  minio_data:
  redis_data:

