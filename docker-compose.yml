services:
  redis:
    image: redis:latest
    restart: always
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  db:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bioaccess"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./server
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILES_ACTIVE}
      SPRING_DATA_REDIS_HOST: ${CACHE_HOST}
      SPRING_DATA_REDIS_PORT: ${CACHE_PORT}
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

  web:
    build:
      context: ./web
      target: ${BUILD_TARGET:-development}
    ports:
      - "80:80" # Usado apenas em produção, pois em testes automatizados utilizado na rede interna.
    depends_on:
      - app

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${FS_USERNAME}
      MINIO_ROOT_PASSWORD: ${FS_PASSWORD}
      S3_ENDPOINT: http://localhost:9000
    volumes:
      - minio_data:/data
    expose:
      - "9001"
      - "9000"
    restart: always

volumes:
  minio_data:
  redis_data:

